# 工程配置；凭据与表 ID 使用环境变量，见 README.md。
# 修改本文件后需重新部署云函数。

preset: live
planner: deepseek
model: deepseek-v4-flash

# 知识检索器：faq（仓库默认）| lightrag（生产 Layer 通过环境变量选择）
knowledge_retriever: faq

# 工具白名单（live 预设生效；shadow 预设有各自的固定范围）
allowed_tools:
  - record_meal
  - query_today
  - query_food_nutrition
  - revise_intake
  - query_knowledge
  - query_history
  - calculate_meal
  - update_user_settings
  - query_memory

# 本地时区偏移（小时），用于“今天”的口径
timezone_offset_hours: 8

context_window: 1048576
input_target_tokens: 16000
output_tokens: 8192
protocol_margin_tokens: 2048
recent_turns: 2
summary_pending_tokens: 4000
summary_input_tokens: 12000
summary_output_tokens: 1024
summary_max_tokens: 4096
max_model_calls: 4
max_tool_calls: 8
deadline_seconds: 90
model_step_seconds: 40
